name: HaruKaizen Monorepo CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build (API, Web, Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Service Container: PostgreSQL 17 e Redis 7 per parity locale e test reali
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harukaizen
          POSTGRES_PASSWORD: harukaizen_secret
          POSTGRES_DB: harukaizen_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Next.js Turbopack / Cache Restoration
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 📦 Install root & workspaces dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🛡️ Typecheck Mobile App (TypeScript)
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: 🧪 Run Vitest Test Suite (Apps API)
        env:
          DATABASE_URL: postgresql://harukaizen:harukaizen_secret@localhost:5433/harukaizen_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm test --workspace=api

      - name: 🏗️ Build Backend API (NestJS)
        run: npm run build --workspace=api

      - name: 🌐 Build Frontend Web (Next.js 16 Turbopack Standalone)
        run: npm run build --workspace=web

  docker-build-verification:
    name: Docker Multi-Stage Verification
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Test Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: harukaizen-api:ci-test

      - name: 🔨 Test Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: harukaizen-web:ci-test

